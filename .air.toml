root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/main"
# -tags devbypass compiles internal/pkg/devbypass's ENABLED variant,
# which accepts OTP 0000 when APP_ENV=development. `make build` does
# NOT pass it, so a production binary cannot contain the bypass at all.
cmd = "go build -tags devbypass -o ./tmp/main ./cmd/main.go"
delay = 1000
exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs", "logs"]
exclude_regex = ["_test.go"]
include_ext = ["go"]
kill_delay = "0s"
log = "build-errors.log"
stop_on_error = false

[color]
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false
